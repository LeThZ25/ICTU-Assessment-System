name: module3-ci

on:
  push:
    paths: ["module3-ai-agent/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["module3-ai-agent/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: module3-ai-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            module3-ai-agent/requirements.txt
            module3-ai-agent/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Lint (real errors only - syntax, undefined names, unused imports)
        run: ruff check --select E9,F app scripts tests agent
      - name: Release checks (static)
        run: python scripts/release_check.py
      # Offline suite: the Gemini API is faked, integration tests are deselected by pytest.ini.
      # No API key is needed or used in CI.
      - name: Tests
        run: pytest -q
      - name: Prompt lock (shipped prompts match the committed fingerprints)
        run: python -c "from app.core import prompt_registry as r; p = r.verify_lock(); print(p); raise SystemExit(1 if p else 0)"
      - name: Offline retrieval-quality evaluation
        run: python scripts/evaluate_rag.py --validate-only

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build API image (module context)
        run: docker build -t module3-api:ci .
      - name: Build API image (repo-root context, as Render may use)
        working-directory: .
        run: docker build -f module3-ai-agent/Dockerfile -t module3-api:ci-root .

  # Advisory dependency vulnerability scan. Needs internet (PyPI/OSV), never blocks a merge.
  # Direct requirements only (--no-deps): transitive dependencies are NOT covered by this job.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # chromadb 0.5.23: PYSEC-2026-3813/3814/3815 have NO fixed release upstream yet (pip-audit reports no fix
      # version), so they are ignored explicitly and ONLY by ID. Remove the --ignore-vuln flags once a fixed chromadb
      # exists. Every other finding (runtime or dev/test tooling) still fails this job.
      - name: pip-audit (direct requirements, runtime + dev)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
